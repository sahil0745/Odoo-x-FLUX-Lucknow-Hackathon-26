services:
  # ----------------------------------------------------------------------------
  # Brightloop Backend API Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: brightloop-backend-api
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install && npm --prefix backend install && npm --prefix backend run prisma:generate && npm --prefix backend run build
    startCommand: npm --prefix backend run start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_PREFIX
        value: /api/v1
      - key: DATABASE_URL
        fromDatabase:
          name: brightloop-postgres
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: https://brightloop.vercel.app
      - key: FRONTEND_URL
        value: https://brightloop.vercel.app
      - key: DEFAULT_CURRENCY
        value: USD

databases:
  # ----------------------------------------------------------------------------
  # Brightloop Managed PostgreSQL 16
  # ----------------------------------------------------------------------------
  - name: brightloop-postgres
    plan: starter
    region: oregon
    databaseName: brightloop_subscriptions
    user: brightloop_user
